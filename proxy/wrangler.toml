name = "blades-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Custom domain som appen anropar (EXPO_PUBLIC_PROXY_URL=https://api.blades-app.com).
# Kopplar den till DENNA worker så att `wrangler deploy` serverar rätt (fixade) kod
# även på api.blades-app.com — inte bara på *.workers.dev.
routes = [
  { pattern = "api.blades-app.com", custom_domain = true }
]

# API-nyckeln lagras som secret — aldrig i kod eller git.
# Sätt den med: wrangler secret put ANTHROPIC_API_KEY
#
# RevenueCat-hemligheter lagras som SECRETS (överlever deploy, hamnar ej i git):
#   wrangler secret put REVENUECAT_SECRET_KEY     (v2 sk_…-nyckeln)
#   wrangler secret put REVENUECAT_WEBHOOK_AUTH   (delad hemlighet för webhooken)
#
# Esri (share-kortets satellitbilder) — ArcGIS Location Platform-nyckel med privilegiet Basemaps:
#   wrangler secret put ARCGIS_API_KEY
# Nyckeln löper ut efter max 1 år → skapa en ny i Esris dashboard och kör kommandot igen (ingen app-build).

# Daglig modellkontroll 04:17 UTC (src/modelFallback.ts): saknas en modell som appen begär hos Anthropic
# pekas den om till nästa i familjen innan någon användare märker det.
# Blades Ops-bevakningen varje timme, minut 7 (OPS_MONITOR_CRON i src/ops.ts — ändra båda ställena ihop).
[triggers]
crons = ["17 4 * * *", "7 * * * *"]

# Larmmejl från bevakningen: ops@blades-app.com → OPS_ALERT_TO, annars SUPPORT_FORWARD_TO.
# Mottagaren måste vara verifierad i Email Routing. Stäng av med OPS_ALERTS = "off" under [vars].
[[send_email]]
name = "ALERT_MAIL"

# Blades Ops — driftsidan https://api.blades-app.com/ops (src/ops.ts). Hemligheter (wrangler secret put …):
#   OPS_PASSWORD           lösenordet till /ops
#   OPS_COOKIE_SECRET      slumpad nyckel som signerar inloggningen:  openssl rand -hex 32 | npx wrangler secret put OPS_COOKIE_SECRET
#   SENTRY_API_TOKEN       Sentry → intern integration "Blades Ops" (Project/Issue & Event/Organization: Read)
#   REVENUECAT_METRICS_KEY RevenueCat v2-nyckel med "Charts metrics: Read only"
#   ASC_ISSUER_ID, ASC_KEY_ID, ASC_VENDOR_NUMBER  App Store Connect API-nyckel + leverantörsnummer
#   ASC_PRIVATE_KEY        innehållet i AuthKey_<KEYID>.p8:  npx wrangler secret put ASC_PRIVATE_KEY < ~/Downloads/AuthKey_<KEYID>.p8
#   CF_ANALYTICS_TOKEN     Cloudflare-token: Account Analytics Read + Zone Analytics Read (blades-app.com)
#   CF_ZONE_ID             zon-id för blades-app.com
#   SUPPORT_FORWARD_TO     dit supportmejlen vidarebefordras (måste vara verifierad i Email Routing)
#   CLAUDE_TASKS_TOKEN     Claudes nyckel till uppgiftsinkorgen /ops/inbox; samma värde ligger i ~/.config/blades-ops/token
# Email Routing: support@blades-app.com → "Send to a Worker" → blades-api (först EFTER deploy + SUPPORT_FORWARD_TO).

# Icke-hemlig config → [vars] (så den inte nollas vid deploy).
[vars]
REVENUECAT_PROJECT_ID = "proj5514c011"
SENTRY_ORG = "jesper-toreld"
SENTRY_PROJECT = "blades-ios"
SENTRY_PROJECT_ID = "4512330034839632"
ASC_APP_ID = "6798360464"
# Anthropic-kredit vid ett datum → /ops visar uppskattat saldo (kredit minus proxyns kostnad sedan dess).
# Uppdatera båda när du fyller på krediten.
OPS_CREDIT_USD = "24"
OPS_CREDIT_SINCE = "2026-10-28"

# Telemetri — Cloudflare Analytics Engine (gratis)
[[analytics_engine_datasets]]
binding = "TELEMETRY"

# Quota tracking — KV namespace for per-device monthly limits
# Create with: wrangler kv:namespace create QUOTA_KV
# Then add the id below:
[[kv_namespaces]]
binding = "QUOTA_KV"
id = "784887bfd7f24f4a81f846f42409c8fb"

# Rate limit för satellit-tiles (GET /map/imagery/…) per enhet — skyddar Esri-kvoten mot skrapning.
# Ett share-kort behöver ≤ 18 tiles per zoomnivå. namespace_id = valfritt unikt heltal i kontot.
[[ratelimits]]
name = "MAP_LIMITER"
namespace_id = "4211"

  [ratelimits.simple]
  limit = 180
  period = 60

# Rate limit för webbplatsens satellit-tiles (GET /web/imagery/…) per IP (hashad) — flygplatskortet på
# blades-app.com behöver ~20 tiles per flygplats. Skyddar Esri-kvoten mot skrapning via sajten.
[[ratelimits]]
name = "WEB_MAP_LIMITER"
namespace_id = "4212"

  [ratelimits.simple]
  limit = 120
  period = 60
