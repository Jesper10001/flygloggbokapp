<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLADES — Joint Logbook</title>
<meta name="description" content="AI-powered digital flight logbook for helicopter pilots, fixed-wing pilots, drone operators, and flight schools. OCR scanning, EASA tracking, PDF export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site/site-editorial.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script src="site/strings.js"></script>
  <script type="text/babel" src="site/site-icons.jsx"></script>
  <script type="text/babel" src="site/site-editorial.jsx"></script>
  <script type="text/babel">
    function App() {
      const t = window.SITE_STRINGS['en'];
      return <window.EditorialSite t={t} lang="en" onLang={() => {}} heroVariant="split" />;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</html>
