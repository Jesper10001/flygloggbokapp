<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design_doc_mode" content="canvas">
<title>Settings — Blade-coins B variants</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
a{color:#00C8E8}a:hover{color:#33D4ED}
body{font-family:'Geist',system-ui,sans-serif}
.lbl{position:absolute;top:20px;width:390px;font:600 15px/1.3 'Geist Mono',monospace;color:#1b2635}
.lbl span{display:block;font:400 13px/1.4 Geist,sans-serif;color:#556;margin-top:4px}
.ph{position:absolute;top:110px;width:390px;height:460px;background:#0A1628;border-radius:36px;padding:28px 20px 20px;color:#F4F7FA;overflow:hidden}
.ghost{background:#11202F;border:1px solid #1D3350;border-radius:18px;height:72px;opacity:.35}
.ghost.s{height:52px;margin-top:10px}
.ghost.l{height:56px;margin-top:22px}
.slot{margin-top:22px}
.coin{display:block;object-fit:contain;flex:none}
.q{width:16px;height:16px;border-radius:50%;border:1.5px solid #56708C;display:grid;place-items:center;font:700 10px Geist;color:#7F98B2;flex:none}
.foot{font-size:12px;color:#7F98B2}
.t{flex:1;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.n{font:700 15px 'Geist Mono',monospace;color:#00C8E8}
.n span{color:#56708C;font-weight:500}
.top{display:flex;align-items:center;gap:12px}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px 0 8px}
.segs i{height:8px;border-radius:2px;background:#1A2D45}
.segs i.on{background:linear-gradient(180deg,#7DF2FF,#00B4D8);box-shadow:0 0 8px rgba(0,214,255,.35)}
.segs i.part{background:linear-gradient(90deg,#1CD8F5 50%,#1A2D45 50%)}
.row{display:flex;align-items:center;gap:16px}
.col{flex:1;min-width:0}
/* B4 ticks */
.ticks{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin:12px 0 8px}
.ticks i{height:14px;border-radius:1.5px;background:#1A2D45}
.ticks i.on{background:#1CD8F5;box-shadow:0 0 6px rgba(0,214,255,.3)}
/* B5 big num */
.bignum{font:700 30px/1 'Geist Mono',monospace;letter-spacing:-1px;color:#F4F7FA}
.bignum span{font-size:14px;font-weight:500;color:#56708C;letter-spacing:0;margin-left:4px}
</style>
</head>
<body>
<div class="lbl" style="left:40px">B2 · LARGER COIN, LEFT<span>64px coin to the left of the whole block. Text, cells and caption stack beside it.</span></div>
<div class="ph" style="left:40px" data-screen-label="B2">
<div class="ghost"></div><div class="ghost s"></div>
<div class="slot row">
<img class="coin" src="FlightLogApp/assets/Blade_coin.PNG" alt="" style="width:64px;height:64px">
<div class="col">
<div class="top"><div class="t">Blade-coins <span class="q">?</span></div><div class="n">195 <span>/ 250</span></div></div>
<div class="segs" style="margin:10px 0 6px"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="part"></i><i></i><i></i></div>
<div class="foot">Left this month · refills monthly</div>
</div>
</div>
<div class="ghost l"></div>
</div>

</body>
</html>
